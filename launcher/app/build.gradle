plugins {
    id 'com.android.application'
}

android {
    namespace 'tv.clean.home'
    compileSdk 34

    defaultConfig {
        applicationId 'tv.clean.home'
        minSdk 30          // Fire OS 8 = Android 11
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
